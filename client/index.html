    <title>+1 Boomerang Per Click</title>

    <!-- Bloxity SDK. Exposes itself as window.Legion.SDK.
         `defer` stops it blocking the page while still running before the Vite
         entry module below (deferred scripts run in order); BloxityProvider also
         waits for window.Legion.SDK, so a slow CDN can't break startup. -->
    <link rel="preconnect" href="https://static.bloxity.io" crossorigin />
    <script defer src="https://sdk.bloxity.io/v1/legion-sdk.min.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
